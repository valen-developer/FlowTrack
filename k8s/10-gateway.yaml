apiVersion: v1
kind: Service
metadata:
  name: flowtrack-gateway
  namespace: flowtrack
spec:
  ports:
  - port: 5001
    targetPort: 5001
    name: http
  selector:
    app: flowtrack-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowtrack-gateway
  namespace: flowtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowtrack-gateway
  template:
    metadata:
      labels:
        app: flowtrack-gateway
    spec:
      containers:
      - name: gateway
        image: localhost:5000/flowtrack-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
        volumeMounts:
        - name: config
          mountPath: /app/appsettings.json
          subPath: appsettings.json
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
      volumes:
      - name: config
        configMap:
          name: gateway-config
