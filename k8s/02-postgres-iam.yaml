apiVersion: v1
kind: Service
metadata:
  name: postgres-iam
  namespace: flowtrack
spec:
  ports:
  - port: 5432
    name: postgres
  clusterIP: None
  selector:
    app: postgres-iam
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-iam
  namespace: flowtrack
spec:
  serviceName: postgres-iam
  replicas: 1
  selector:
    matchLabels:
      app: postgres-iam
  template:
    metadata:
      labels:
        app: postgres-iam
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: flowtrack
        - name: POSTGRES_PASSWORD
          value: flowtrack
        - name: POSTGRES_DB
          value: flowtrack
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
