apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowtrack-iam-hpa
  namespace: flowtrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowtrack-iam
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowtrack-workmanagement-hpa
  namespace: flowtrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowtrack-workmanagement
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
