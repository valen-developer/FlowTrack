apiVersion: v1
kind: Service
metadata:
  name: flowtrack-workmanagement
  namespace: flowtrack
spec:
  ports:
  - port: 5003
    targetPort: 5003
    name: http
  selector:
    app: flowtrack-workmanagement
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowtrack-workmanagement
  namespace: flowtrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowtrack-workmanagement
  template:
    metadata:
      labels:
        app: flowtrack-workmanagement
    spec:
      containers:
      - name: workmanagement
        image: localhost:5000/flowtrack-workmanagement:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        envFrom:
        - configMapRef:
            name: flowtrack-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
