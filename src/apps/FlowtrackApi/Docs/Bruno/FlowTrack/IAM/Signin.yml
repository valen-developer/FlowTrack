info:
  name: Signin
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/signin"
  body:
    type: json
    data: |-
      {
        "email": "email@email.com",
        "password": "Password1"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:5002

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
