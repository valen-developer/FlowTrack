services:
  postgres:
    image: postgres:18-alpine
    container_name: flowtrack-db
    environment:
      POSTGRES_USER: flowtrack
      POSTGRES_PASSWORD: flowtrack
      POSTGRES_DB: flowtrack
    ports:
      - '5432:5432'
    networks:
      flowtrack:
        aliases:
          - flowtrack-db
    volumes:
      - flowtrack:/var/lib/postgresql

  elasticsearch:
    image: elasticsearch:9.4.2
    container_name: flowtrack-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - http.cors.enabled=true
      - "http.cors.allow-origin=http://localhost:8082"
    ports:
      - '9201:9200'
      - '9301:9300'
    networks:
      flowtrack:
        aliases:
          - flowtrack-elasticsearch
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  filebeat:
    image: elastic/filebeat:9.4.2
    container_name: flowtrack-filebeat
    environment:
      - xpack.monitoring.enabled=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/flowtrack
    networks:
      flowtrack-monitoring:
        aliases:
          - flowtrack-filebeat
    restart: unless-stopped

  elasticvue:
    image: cars10/elasticvue
    container_name: flowtrack-elasticvue
    ports:
      - '8082:8080'
    networks:
      flowtrack:
        aliases:
          - flowtrack-elasticvue

networks:
  flowtrack:
    external: true
  flowtrack-monitoring:
    external: true

volumes:
  flowtrack:
    driver: local
  elasticsearch-data:
    driver: local
